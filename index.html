<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="StackedUp"/>
<meta name="theme-color" content="#0C0C14"/>
<title>StackedUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body,#root{height:100%;background:#0C0C14;overflow:hidden}
#root{display:flex;justify-content:center}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input,button{outline:none;-webkit-appearance:none}
::-webkit-scrollbar{display:none}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(0.9)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.fade{animation:slideUp 0.25s ease forwards}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ─── Budget ──────────────────────────────────────────────────────────────────
const BUDGET_DEFAULTS = [
  ['Fixed',    'Property Tax',         2125],
  ['Fixed',    '529 College Savings',  1100],
  ['Fixed',    'Insurance',             479],
  ['Fixed',    'Utilities',             709],
  ['Fixed',    'Home Services',         614],
  ['Fixed',    'Kids Activities',      1174],
  ['Fixed',    'Car & Gas',             220],
  ['Variable', 'Groceries',             800],
  ['Variable', 'Dining Out',           2200],
  ['Variable', 'Amazon & Shopping',     800],
  ['One-Time', 'Clothes & Apparel',     800],
  ['One-Time', 'Vacation & Travel',     750],
];

// ─── Plaid category → budget line ────────────────────────────────────────────
const PLAID_MAP = {
  'Food and Drink > Restaurants':'Dining Out','Food and Drink > Fast Food':'Dining Out',
  'Food and Drink > Coffee Shop':'Dining Out','Food and Drink > Bar':'Dining Out',
  'Food and Drink > Groceries':'Groceries','Food and Drink':'Groceries',
  'Shops > Clothing and Accessories':'Clothes & Apparel','Shops > Sporting Goods':'Clothes & Apparel',
  'Shops > Department Stores':'Amazon & Shopping','Shops > Online Marketplaces':'Amazon & Shopping',
  'Shops > Electronics':'Amazon & Shopping','Shops > Pharmacies':'Amazon & Shopping',
  'Shops > Home Improvement':'Home Services','Shops':'Amazon & Shopping',
  'Travel > Airlines and Aviation Services':'Vacation & Travel','Travel > Hotels':'Vacation & Travel',
  'Travel > Gas Stations':'Car & Gas','Travel > Parking':'Car & Gas',
  'Travel > Taxi':'Car & Gas','Travel > Car Service':'Car & Gas','Travel':'Vacation & Travel',
  'Service > Insurance':'Insurance','Service > Utilities':'Utilities',
  'Service > Telecommunication Services':'Utilities','Service > Subscription':'Utilities',
  'Service > Landscaping and Lawn Service':'Home Services','Service > Cleaning':'Home Services',
  'Service > Pest Control':'Home Services','Service > Home Maintenance and Repairs':'Home Services',
  'Service > Child Care':'Kids Activities','Service':'Amazon & Shopping',
  'Recreation > Sports Clubs':'Kids Activities','Recreation':'Dining Out',
  'Education':'Kids Activities','Healthcare':'Amazon & Shopping',
  'Investment':'529 College Savings',
  'Transfer':'__X__','Payment':'__X__','Deposit':'__X__',
  'Tax':'__X__','Interest':'__X__','Bank Fees':'__X__',
};

function mapPlaid(cats) {
  if (!cats?.length) return 'Amazon & Shopping';
  const full = cats.join(' > ');
  for (const k of Object.keys(PLAID_MAP)) if (full.startsWith(k)) return PLAID_MAP[k];
  return PLAID_MAP[cats[0]] ?? 'Amazon & Shopping';
}

function normalizeTxns(raw) {
  return raw.filter(t => t.amount > 0).map(t => ({
    id: t.transaction_id,
    date: t.date,
    dateObj: new Date(t.date + 'T00:00:00'),
    month: new Date(t.date + 'T00:00:00').getMonth(),
    year: new Date(t.date + 'T00:00:00').getFullYear(),
    desc: t.merchant_name || t.name,
    amount: t.amount,
    mappedTo: mapPlaid(t.category),
    pending: t.pending,
  })).filter(t => t.mappedTo !== '__X__');
}

// ─── Utils ────────────────────────────────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULL_M  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const BKT_CLR = { Fixed:'#5BA4E5', Variable:'#56C27A', 'One-Time':'#A97FE8' };

const LS = {
  get: (k,d=null) => { try { const v=localStorage.getItem(k); return v!==null?JSON.parse(v):d } catch { return d } },
  set: (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)) } catch {} },
  rm:  k => { try { localStorage.removeItem(k) } catch {} },
};

const api = (path, body) =>
  fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());

const $m = n => n===0 ? '—' : `${n<0?'-':''}$${Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0})}`;

function yearsToFIRE(saved, annual, target, ret=0.07) {
  if (saved >= target) return 0;
  let b=saved, n=0;
  while (b<target && n<80) { b=b*(1+ret)+annual; n++; }
  return n;
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [setup,    _setSetup]   = useState(() => LS.get('setup', null));
  const [tab,      setTab]      = useState('budget');
  const [txns,     _setTxns]    = useState(() => LS.get('txns', []));
  const [bMods,    _setBMods]   = useState(() => LS.get('bmods', {}));
  const [plaidTok, setPlaidTok] = useState(() => LS.get('plaid_token'));
  const [accounts, setAccounts] = useState(() => LS.get('plaid_accts', []));
  const [cursor,   setCursor]   = useState(() => LS.get('plaid_cur'));
  const [linkTok,  setLinkTok]  = useState(null);
  const [syncing,  setSyncing]  = useState(false);
  const [lastSync, setLastSync] = useState(() => LS.get('last_sync'));
  const [toast,    setToast]    = useState(null);
  const [selMonth, setSelMonth] = useState(new Date().getMonth());
  const [selYear,  setSelYear]  = useState(new Date().getFullYear());

  const setSetup = v => { _setSetup(v); LS.set('setup', v); };
  const setBMods = v => { _setBMods(v); LS.set('bmods', v); };
  const setTxns  = fn => _setTxns(p => { const n=typeof fn==='function'?fn(p):fn; LS.set('txns',n); return n; });
  const showToast = useCallback((msg, ms=3000) => { setToast(msg); setTimeout(()=>setToast(null), ms); }, []);

  // Fetch Plaid link token
  useEffect(() => {
    if (plaidTok) return;
    api('/api/create-link-token', {})
      .then(d => { if (d.link_token) setLinkTok(d.link_token); })
      .catch(() => {});
  }, [plaidTok]);

  // Auto-sync on load
  useEffect(() => { if (plaidTok) doSync(false); }, []); // eslint-disable-line

  const doSync = useCallback(async (force=false, tokOverride) => {
    const tok = tokOverride ?? plaidTok;
    if (!tok || syncing) return;
    setSyncing(true);
    try {
      const body = { access_token: tok };
      if (!force && cursor) body.cursor = cursor;
      const data = await api('/api/sync', body);
      if (data.error) { showToast(`⚠ ${data.error}`); return; }

      const added    = normalizeTxns(data.added ?? []);
      const modified = normalizeTxns(data.modified ?? []);
      const rmIds    = new Set((data.removed ?? []).map(r => r.transaction_id));

      setTxns(prev => {
        const eIds = new Set(prev.map(t => t.id));
        const base = prev.filter(t => !rmIds.has(t.id)).map(t => modified.find(m=>m.id===t.id) ?? t);
        return [...base, ...added.filter(t => !eIds.has(t.id))].sort((a,b) => b.dateObj-a.dateObj);
      });

      if (data.next_cursor) { LS.set('plaid_cur', data.next_cursor); setCursor(data.next_cursor); }
      const ts = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
      const now = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' ' + ts;
      LS.set('last_sync', now); setLastSync(now);
      if (added.length > 0) showToast(`✓ ${added.length} new transactions`);
      else showToast('✓ Already up to date');
    } catch { showToast('⚠ Sync failed — check your connection'); }
    finally { setSyncing(false); }
  }, [plaidTok, cursor, syncing, showToast]);

  // Open Plaid Link (uses window.Plaid loaded from CDN)
  const openPlaidLink = useCallback(() => {
    if (!linkTok) { showToast('⚠ Not ready yet — try again in a moment'); return; }
    const handler = window.Plaid.create({
      token: linkTok,
      onSuccess: async (publicToken) => {
        try {
          showToast('Connecting your bank...');
          const { access_token } = await api('/api/exchange-token', { public_token: publicToken });
          LS.set('plaid_token', access_token);
          setPlaidTok(access_token);
          const { accounts: accs } = await api('/api/accounts', { access_token });
          LS.set('plaid_accts', accs);
          setAccounts(accs);
          showToast('✓ Bank connected! Syncing transactions...');
          setTimeout(() => doSync(true, access_token), 600);
          // Refresh link token for next time
          api('/api/create-link-token', {}).then(d => { if (d.link_token) setLinkTok(d.link_token); });
        } catch { showToast('⚠ Connection failed — check Vercel env vars'); }
      },
      onExit: () => {},
    });
    handler.open();
  }, [linkTok, doSync, showToast]);

  // Budget + actuals
  const budget      = useMemo(() => BUDGET_DEFAULTS.map(b => ({ bucket:b[0], item:b[1], monthly:bMods[b[1]]??b[2] })), [bMods]);
  const monthTxns   = useMemo(() => txns.filter(t => t.month===selMonth && t.year===selYear && !t.pending), [txns,selMonth,selYear]);
  const actuals     = useMemo(() => {
    const m={}; budget.forEach(b=>m[b.item]=0);
    monthTxns.forEach(t => { if (m[t.mappedTo]!==undefined) m[t.mappedTo]+=t.amount; });
    return m;
  }, [monthTxns, budget]);
  const totalBudget = budget.reduce((s,b) => s+b.monthly, 0);
  const totalActual = Object.values(actuals).reduce((s,v) => s+v, 0);
  const today       = new Date();
  const isNow       = selMonth===today.getMonth() && selYear===today.getFullYear();
  const daysInMonth = new Date(selYear, selMonth+1, 0).getDate();
  const daysElapsed = isNow ? today.getDate() : daysInMonth;
  const projected   = daysElapsed > 0 ? (totalActual/daysElapsed)*daysInMonth : 0;
  const availMonths = useMemo(() => {
    const s = new Set(txns.map(t=>`${t.year}-${String(t.month).padStart(2,'0')}`));
    return [...s].sort().reverse().map(k => {
      const [y,m] = k.split('-').map(Number);
      return { year:y, month:m, label:`${MONTHS[m]} ${y}` };
    });
  }, [txns]);

  if (!setup) return <Onboarding onDone={setSetup} totalBudget={totalBudget} />;

  return (
    <div style={S.root}>
      <div style={S.notch}/>

      <header style={S.hdr}>
        <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
          <div style={S.avatar}>{(setup.name||'S')[0]}</div>
          <div>
            <div style={S.hName}>{setup.name||'My Budget'}</div>
            <div style={S.hSub}>{syncing ? '⟳ Syncing...' : lastSync ? `Synced ${lastSync}` : 'Not yet synced'}</div>
          </div>
        </div>
        <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
          {plaidTok && <button style={S.iconBtn} onClick={()=>doSync(false)} disabled={syncing}>{syncing?'⟳':'↻'}</button>}
          <MonthPicker months={availMonths} sm={selMonth} sy={selYear} onChange={(m,y)=>{setSelMonth(m);setSelYear(y);}}/>
        </div>
      </header>

      <div style={S.scroll}>
        {tab==='budget' && <BudgetTab
          budget={budget} bMods={bMods} setBMods={setBMods}
          actuals={actuals} totalBudget={totalBudget} totalActual={totalActual}
          projected={projected} isNow={isNow} daysElapsed={daysElapsed} daysInMonth={daysInMonth}
          monthTxns={monthTxns} monthLabel={`${FULL_M[selMonth]} ${selYear}`}
          plaidTok={plaidTok} openPlaidLink={openPlaidLink} linkTok={linkTok}
          accounts={accounts} syncing={syncing} doSync={doSync} lastSync={lastSync}
          txnCount={txns.length} setTxns={setTxns}
          disconnect={() => {
            ['plaid_token','plaid_cur','plaid_accts','last_sync'].forEach(k=>LS.rm(k));
            setPlaidTok(null); setCursor(null); setAccounts([]); setLastSync(null); setTxns([]);
            showToast('Disconnected');
          }}
        />}
        {tab==='networth' && <NetWorthTab setup={setup} setSetup={setSetup}/>}
        {tab==='fire'     && <FireTab setup={setup} setSetup={setSetup} totalBudget={totalBudget}/>}
      </div>

      <nav style={S.nav}>
        {[{id:'budget',icon:'≡',lbl:'Budget'},{id:'networth',icon:'🏦',lbl:'Net Worth'},{id:'fire',icon:'🔥',lbl:'FIRE'}].map(t=>(
          <button key={t.id} style={{...S.navBtn, color:tab===t.id?'#5BA4E5':'#2A2A45'}} onClick={()=>setTab(t.id)}>
            <span style={{fontSize:'22px', display:'block', marginBottom:'3px'}}>{t.icon}</span>
            <span style={{fontSize:'11px', fontWeight:tab===t.id?'700':'400'}}>{t.lbl}</span>
          </button>
        ))}
      </nav>
      <div style={S.safe}/>
      {toast && <div style={S.toast}>{toast}</div>}
    </div>
  );
}

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const [d, setD] = useState({
    name:'', checkingBalance:0, savingsBalance:0, investmentBalance:850000,
    homeValue:1200000, otherAssets:0, mortgageBalance:750000, otherDebtBalance:0,
    currentAge:45, fireAge:55, fireAnnualSpend:140000, annualSavings:150000, takeHomePay:24480,
  });
  const n = (k,v) => setD(p=>({...p,[k]:parseFloat(v)||0}));
  const s = (k,v) => setD(p=>({...p,[k]:v}));

  const assets   = d.checkingBalance+d.savingsBalance+d.investmentBalance+d.homeValue+d.otherAssets;
  const debts    = d.mortgageBalance+d.otherDebtBalance;
  const netWorth = assets-debts;
  const fireNum  = d.fireAnnualSpend/0.04;
  const yrs      = yearsToFIRE(d.investmentBalance, d.annualSavings, fireNum);
  const steps    = ['Welcome','Your Numbers','FIRE Goal'];

  return (
    <div style={S.root}>
      <div style={S.notch}/>
      <div style={{background:'#0A0A14', padding:'16px 18px', borderBottom:'1px solid #1A1A28', flexShrink:0}}>
        <div style={{display:'flex', justifyContent:'space-between', marginBottom:'10px'}}>
          <span style={{fontWeight:'700', color:'#E8EAF0', fontSize:'15px'}}>{steps[step]}</span>
          <span style={{fontSize:'12px', color:'#445566'}}>{step+1} / {steps.length}</span>
        </div>
        <div style={{height:'4px', background:'#1A1A28', borderRadius:'2px'}}>
          <div style={{height:'100%', borderRadius:'2px', background:'linear-gradient(90deg,#1F3864,#5BA4E5)', width:`${((step+1)/steps.length)*100}%`, transition:'width 0.4s'}}/>
        </div>
      </div>

      <div style={{flex:1, overflowY:'auto', WebkitOverflowScrolling:'touch', paddingBottom:'90px'}}>
        <div style={{padding:'22px 18px'}} className="fade" key={step}>
          {step===0 && <>
            <div style={{textAlign:'center', padding:'24px 0 32px'}}>
              <div style={{fontSize:'64px', lineHeight:1, marginBottom:'16px'}}>💰</div>
              <h2 style={{color:'#E8EAF0', fontSize:'24px', fontWeight:'700', letterSpacing:'-0.02em', marginBottom:'12px'}}>Welcome to StackedUp</h2>
              <p style={{color:'#8899AA', fontSize:'14px', lineHeight:'1.8'}}>
                Budget · Net worth · FIRE — powered by your real bank data via Plaid.
              </p>
            </div>
            <F l="Your name (or family name)" v={d.name} c={v=>s('name',v)} h="e.g. Shiv & Family"/>
          </>}

          {step===1 && <>
            <p style={{color:'#8899AA', fontSize:'13px', marginBottom:'20px', lineHeight:'1.7'}}>
              These seed your net worth tracker. Update them anytime by tapping Net Worth.
            </p>
            <SH>What you own</SH>
            <R2>
              <F l="Checking" t="number" p="$" v={d.checkingBalance} c={v=>n('checkingBalance',v)}/>
              <F l="Savings / HYSA" t="number" p="$" v={d.savingsBalance} c={v=>n('savingsBalance',v)}/>
            </R2>
            <F l="Investments (401k / IRA / brokerage)" t="number" p="$" v={d.investmentBalance} c={v=>n('investmentBalance',v)}/>
            <R2>
              <F l="Home value" t="number" p="$" v={d.homeValue} c={v=>n('homeValue',v)}/>
              <F l="Other assets" t="number" p="$" v={d.otherAssets} c={v=>n('otherAssets',v)}/>
            </R2>
            <SH>What you owe</SH>
            <R2>
              <F l="Mortgage" t="number" p="$" v={d.mortgageBalance} c={v=>n('mortgageBalance',v)}/>
              <F l="Other debt" t="number" p="$" v={d.otherDebtBalance} c={v=>n('otherDebtBalance',v)}/>
            </R2>
            <div style={{background:'#0F1A2E', border:'1px solid #1E3050', borderRadius:'12px', padding:'14px', display:'flex', justifyContent:'space-around', textAlign:'center'}}>
              {[['Net Worth',$m(netWorth),netWorth>=0?'#56C27A':'#FF6B6B'],['Assets',$m(assets),'#5BA4E5'],['Debt',$m(debts),'#FF6B6B']].map(([l,v,c])=>(
                <div key={l}><div style={{fontSize:'10px', color:'#445566', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:'4px'}}>{l}</div><div style={{color:c, fontWeight:'700', fontSize:'16px'}}>{v}</div></div>
              ))}
            </div>
          </>}

          {step===2 && <>
            <p style={{color:'#8899AA', fontSize:'13px', marginBottom:'20px', lineHeight:'1.7'}}>
              Powers your FIRE calculator. Change these anytime in the FIRE tab.
            </p>
            <R2>
              <F l="Current age" t="number" v={d.currentAge} c={v=>n('currentAge',v)}/>
              <F l="Target FIRE age" t="number" v={d.fireAge} c={v=>n('fireAge',v)}/>
            </R2>
            <F l="Desired annual spending in retirement" t="number" p="$" v={d.fireAnnualSpend} c={v=>n('fireAnnualSpend',v)} h="Usually 70–80% of today's annual spending"/>
            <F l="Amount you invest each year" t="number" p="$" v={d.annualSavings} c={v=>n('annualSavings',v)} h="Across 401k, IRA, brokerage combined"/>
            <F l="Monthly take-home pay" t="number" p="$" v={d.takeHomePay} c={v=>n('takeHomePay',v)} h="After taxes — for savings rate calc"/>
            <div style={{background:'#0F1A0F', border:'1px solid #1E3A20', borderRadius:'12px', padding:'16px', display:'flex', justifyContent:'space-around', textAlign:'center'}}>
              {[['FIRE Number',$m(fireNum),'#F4B942'],['Years Away',yrs<=80?yrs:'80+','#5BA4E5'],['FIRE Age',d.currentAge+yrs<=120?d.currentAge+yrs:'80+',(d.currentAge+yrs)<=d.fireAge?'#56C27A':'#F4B942']].map(([l,v,c])=>(
                <div key={l}><div style={{fontSize:'10px', color:'#445566', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:'4px'}}>{l}</div><div style={{color:c, fontWeight:'700', fontSize:'17px'}}>{v}</div></div>
              ))}
            </div>
          </>}
        </div>
      </div>

      <div style={{position:'fixed', bottom:0, left:'50%', transform:'translateX(-50%)', width:'100%', maxWidth:'430px', padding:'14px 18px', paddingBottom:'calc(14px + env(safe-area-inset-bottom,0))', background:'rgba(12,12,20,0.97)', borderTop:'1px solid #1A1A28', display:'flex', gap:'10px', flexShrink:0}}>
        {step>0 && <button style={{...S.btn2, width:'80px', flexShrink:0}} onClick={()=>setStep(s=>s-1)}>← Back</button>}
        {step < steps.length-1
          ? <button style={{...S.btn1, flex:1}} onClick={()=>setStep(s=>s+1)}>Continue →</button>
          : <button style={{...S.btn1, flex:1}} onClick={()=>onDone({...d, totalAssets:assets, totalDebt:debts, netWorth})}>Open My App →</button>
        }
      </div>
    </div>
  );
}

// ─── BUDGET TAB ───────────────────────────────────────────────────────────────
function BudgetTab({budget,bMods,setBMods,actuals,totalBudget,totalActual,projected,
  isNow,daysElapsed,daysInMonth,monthTxns,monthLabel,
  plaidTok,openPlaidLink,linkTok,accounts,syncing,doSync,lastSync,txnCount,setTxns,disconnect}) {

  const [view,    setView]    = useState('overview');
  const [openRow, setOpenRow] = useState(null);
  const [editing, setEditing] = useState(false);
  const [editTxn, setEditTxn] = useState(null);

  const over = totalActual > totalBudget;
  const pct  = totalBudget > 0 ? Math.min(1, totalActual/totalBudget) : 0;

  const byItem = useMemo(() => {
    const m={};
    monthTxns.forEach(t => { (m[t.mappedTo]=m[t.mappedTo]??[]).push(t); });
    return m;
  }, [monthTxns]);

  const reCat = (id, cat) => { setTxns(p=>p.map(t=>t.id===id?{...t,mappedTo:cat}:t)); setEditTxn(null); };
  const lineItems = budget.map(b=>b.item);

  return (
    <div style={S.page}>
      {/* Month hero */}
      <div style={{...S.hero, textAlign:'center'}}>
        <div style={S.heroLbl}>{monthLabel}</div>
        <div style={{...S.heroAmt, color:over?'#FF6B6B':'#F4F4F4'}}>{$m(totalActual)}</div>
        <div style={S.heroSub}>
          of <span style={{color:'#5BA4E5'}}>{$m(totalBudget)}</span>{'  ·  '}
          <span style={{color:over?'#FF6B6B':'#56C27A'}}>{over?`${$m(totalActual-totalBudget)} over`:`${$m(totalBudget-totalActual)} left`}</span>
        </div>
        <div style={S.bar}><div style={{...S.barFill, width:`${pct*100}%`, background:over?'#FF6B6B':pct>0.85?'#F4B942':'#56C27A'}}/></div>
        <div style={{display:'flex', justifyContent:'space-between', fontSize:'11px', color:'#445566'}}>
          <span>{Math.round(pct*100)}% used</span>

      {/* Bank connection */}
      {!plaidTok ? (
        <div style={{...S.card, borderColor:'#1E3050', textAlign:'center', marginBottom:'12px'}}>
          <div style={{fontSize:'28px', marginBottom:'10px'}}>🏦</div>
          <div style={{fontWeight:'700', fontSize:'16px', marginBottom:'6px'}}>Connect your bank</div>
          <div style={{fontSize:'13px', color:'#8899AA', marginBottom:'16px', lineHeight:'1.7'}}>

          </div>

            {linkTok ? 'Connect Bank Account →' : 'Loading...'}

          <div style={{fontSize:'11px', color:'#445566', marginTop:'10px'}}>
            🔒 Read-only access · 256-bit encryption · Plaid is used by Venmo, Robinhood, and thousands of apps

        </div>
      ) : (
        <div style={{...S.card, background:'#0A1A0A', borderColor:'#1E3A20', marginBottom:'12px'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <div>
              <div style={{color:'#56C27A', fontWeight:'700', marginBottom:'2px'}}>
                ✓ {accounts[0]?.name ?? 'Bank'} connected
              </div>
              <div style={{fontSize:'12px', color:'#445566'}}>
                {txnCount.toLocaleString()} transactions · {lastSync ?? 'syncing...'}
              </div>
            </div>
            <div style={{display:'flex', gap:'6px'}}>
              <button style={S.btnSm} onClick={()=>doSync(false)} disabled={syncing}>{syncing?'⟳':'↻ Sync'}</button>
              <button style={{...S.btnSm, color:'#FF6B6B', borderColor:'#2A1010'}} onClick={disconnect}>✕</button>
            </div>
          </div>
          {accounts.length > 1 && (
            <div style={{fontSize:'11px', color:'#445566', marginTop:'8px', paddingTop:'8px', borderTop:'1px solid #1E3A20'}}>
              {accounts.map(a=>`${a.name} ••${a.mask}`).join('  ·  ')}
            </div>
          )}
        </div>
      )}

      {/* Toggle */}
      <div style={S.toggleRow}>
        {[['overview','Overview'],['transactions','Transactions']].map(([v,l])=>(
          <button key={v} style={{...S.toggleBtn,...(view===v?S.toggleOn:{})}} onClick={()=>setView(v)}>{l}</button>
        ))}
      </div>

      {/* OVERVIEW */}
      {view==='overview' && <>
        {['Fixed','Variable','One-Time'].map(bucket => {
          const rows = budget.filter(b=>b.bucket===bucket);
          const bTot = rows.reduce((s,b)=>s+b.monthly,0);
          const bAct = rows.reduce((s,b)=>s+(actuals[b.item]??0),0);
          const clr  = BKT_CLR[bucket];
          return (
            <div key={bucket} style={{marginBottom:'10px', border:`1px solid ${clr}28`, borderRadius:'14px', overflow:'hidden', background:`${clr}08`}}>
              <div style={{display:'flex', justifyContent:'space-between', padding:'10px 14px 7px'}}>
                <span style={{fontSize:'11px', fontWeight:'700', color:clr, textTransform:'uppercase', letterSpacing:'0.09em'}}>{bucket}</span>
                <span style={{fontSize:'12px'}}>
                  <span style={{color:bAct>bTot?'#FF6B6B':'#F4F4F4', fontWeight:'600'}}>{$m(bAct)}</span>
                  <span style={{color:'#444'}}> / {$m(bTot)}</span>
                </span>
              </div>
              {rows.map(b => {
                const act=actuals[b.item]??0, isO=act>b.monthly;
                const fill=b.monthly>0?Math.min(1,act/b.monthly):0;
                const txs=byItem[b.item]??[], isOpen=openRow===b.item;
                return (
                  <div key={b.item}>
                    <div style={{display:'flex', alignItems:'center', padding:'9px 14px', gap:'12px', cursor:txs.length>0?'pointer':'default', background:isOpen?'#0A0A18':'transparent'}}
                      onClick={()=>txs.length>0&&setOpenRow(isOpen?null:b.item)}>
                      <div style={{flex:1, minWidth:0}}>
                        <div style={{fontSize:'13px', fontWeight:'500', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginBottom:'4px'}}>{b.item}</div>
                        <div style={{height:'3px', background:'#1A1A28', borderRadius:'2px', overflow:'hidden'}}>
                          <div style={{height:'100%', borderRadius:'2px', width:`${fill*100}%`, background:isO?'#FF6B6B':fill>0.85?'#F4B942':clr, transition:'width 0.35s'}}/>
                        </div>
                      </div>
                      <div style={{textAlign:'right', flexShrink:0}}>
                        <span style={{color:isO?'#FF6B6B':act===0?'#333':'#F4B942', fontWeight:'700', fontSize:'14px'}}>{act===0?'—':$m(act)}</span>
                        <span style={{color:'#444', fontSize:'11px'}}> / {$m(b.monthly)}</span>
                        {txs.length>0 && <div style={{fontSize:'10px', color:'#333', marginTop:'2px'}}>{isOpen?'▲':'▼'} {txs.length}</div>}
                      </div>
                    </div>
                    {isOpen && (
                      <div style={{background:'#08080F', borderTop:'1px solid #1A1A28', padding:'4px 14px 8px'}}>
                        {txs.sort((a,b)=>b.amount-a.amount).map(t=>(
                          <div key={t.id}>
                            <div style={{display:'flex', alignItems:'center', gap:'8px', padding:'7px 0', borderBottom:'1px solid #0F0F1A'}}>
                              <span style={{color:'#445566', fontSize:'11px', width:'66px', flexShrink:0}}>{t.date}</span>
                              <span style={{flex:1, fontSize:'12px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{t.desc}</span>
                              <span style={{color:'#F4B942', fontWeight:'600', fontSize:'13px', flexShrink:0}}>{$m(t.amount)}</span>
                              <button style={{...S.btnSm, padding:'3px 7px', fontSize:'10px', flexShrink:0}}
                                onClick={e=>{e.stopPropagation();setEditTxn(editTxn===t.id?null:t.id);}}>✎</button>
                            </div>
                            {editTxn===t.id && (
                              <div style={{padding:'8px 0', display:'flex', flexWrap:'wrap', gap:'5px', paddingBottom:'10px'}}>
                                <div style={{width:'100%', fontSize:'11px', color:'#445566', marginBottom:'3px'}}>Move to:</div>
                                {lineItems.map(li=>(
                                  <button key={li} style={{...S.btnSm, fontSize:'11px', padding:'4px 8px', color:t.mappedTo===li?'#5BA4E5':'#8899AA', borderColor:t.mappedTo===li?'#2E75B6':'#2A2A40'}}
                                    onClick={()=>reCat(t.id,li)}>{li}</button>
                                ))}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}

        {editing && (
          <div style={{...S.card, marginBottom:'10px'}}>
            <div style={{fontSize:'14px', fontWeight:'700', marginBottom:'12px'}}>Monthly Budget Targets</div>
            {budget.map(b=>(
              <div key={b.item} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom:'1px solid #12121E'}}>
                <span style={{fontSize:'12px', flex:1, color:'#C0C0D0', paddingRight:'10px'}}>{b.item}</span>
                <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                  <span style={{color:'#445566', fontSize:'13px'}}>$</span>
                  <input style={S.numInput} type="number" defaultValue={b.monthly}
                    onBlur={e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0)setBMods({...bMods,[b.item]:v});}}/>
                </div>
              </div>
            ))}
            <div style={{fontSize:'12px', color:'#8899AA', marginTop:'10px', textAlign:'right'}}>
              Total: <strong style={{color:'#5BA4E5'}}>{$m(budget.reduce((s,b)=>s+b.monthly,0))}/mo</strong>
            </div>
          </div>
        )}
        <button style={{...S.btn2, marginBottom:'12px'}} onClick={()=>setEditing(!editing)}>
          {editing ? '✓ Done' : '✏ Edit Budget Amounts'}
        </button>
      </>}

      {/* TRANSACTIONS */}
      {view==='transactions' && <>
        {monthTxns.length===0 ? (
          <div style={{textAlign:'center', padding:'70px 20px'}}>
            <div style={{fontSize:'40px', opacity:0.2, marginBottom:'12px'}}>📭</div>
            <div style={{color:'#333', fontSize:'14px'}}>No transactions this month.</div>
            {!plaidTok && <div style={{color:'#333', fontSize:'12px', marginTop:'8px'}}>Connect your bank above to get started.</div>}
          </div>
        ) : monthTxns.map(t => {
          const bkt=budget.find(b=>b.item===t.mappedTo)?.bucket??'Variable';
          const clr=BKT_CLR[bkt];
          return (
            <div key={t.id}>
              <div style={{display:'flex', alignItems:'center', gap:'12px', padding:'10px 0', borderBottom:'1px solid #12121E'}}>
                <div style={{width:'8px', height:'8px', borderRadius:'50%', background:clr, flexShrink:0}}/>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontWeight:'500', fontSize:'13px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{t.desc}</div>
                  <div style={{fontSize:'11px', color:'#445566', marginTop:'2px'}}>{t.date} · <span style={{color:clr}}>{t.mappedTo}</span></div>
                </div>
                <div style={{display:'flex', alignItems:'center', gap:'8px', flexShrink:0}}>
                  <span style={{color:'#F4B942', fontWeight:'700'}}>{$m(t.amount)}</span>
                  <button style={{...S.btnSm, padding:'3px 7px', fontSize:'10px'}}
                    onClick={()=>setEditTxn(editTxn===t.id?null:t.id)}>✎</button>
                </div>
              </div>
              {editTxn===t.id && (
                <div style={{padding:'8px 10px', background:'#0A0A18', borderRadius:'8px', marginBottom:'4px', display:'flex', flexWrap:'wrap', gap:'5px'}}>
                  <div style={{width:'100%', fontSize:'11px', color:'#445566', marginBottom:'3px'}}>Move to category:</div>
                  {lineItems.map(li=>(
                    <button key={li} style={{...S.btnSm, fontSize:'11px', padding:'4px 8px', color:t.mappedTo===li?'#5BA4E5':'#8899AA', borderColor:t.mappedTo===li?'#2E75B6':'#2A2A40'}}
                      onClick={()=>reCat(t.id,li)}>{li}</button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </>}
      <div style={{height:12}}/>
    </div>
  );
}

// ─── NET WORTH TAB ────────────────────────────────────────────────────────────
function NetWorthTab({ setup, setSetup }) {
  const [editing, setEditing] = useState(false);
  const [local,   setLocal]   = useState({...setup});
  useEffect(() => setLocal({...setup}), [setup]);

  const upd = (k,v) => {
    const u = {...local,[k]:parseFloat(v)||0};
    u.totalAssets = (u.checkingBalance||0)+(u.savingsBalance||0)+(u.investmentBalance||0)+(u.homeValue||0)+(u.otherAssets||0);
    u.totalDebt   = (u.mortgageBalance||0)+(u.otherDebtBalance||0);
    u.netWorth    = u.totalAssets-u.totalDebt;
    setLocal(u);
  };

  const src    = editing ? local : setup;
  const assets = src.totalAssets ?? 0;
  const debt   = src.totalDebt ?? 0;
  const nw     = src.netWorth ?? 0;

  return (
    <div style={S.page}>
      <div style={{...S.hero, textAlign:'center'}}>
        <div style={S.heroLbl}>Net Worth</div>
        <div style={{...S.heroAmt, fontSize:'38px', color:nw>=0?'#F4F4F4':'#FF6B6B'}}>{$m(nw)}</div>
        <div style={{display:'flex', justifyContent:'space-around', marginTop:'14px'}}>
          {[['Assets',assets,'#56C27A'],['Debt',debt,'#FF6B6B']].map(([l,v,c])=>(
            <div key={l} style={{textAlign:'center'}}>
              <div style={{fontSize:'10px', color:'#445566', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:'4px'}}>{l}</div>
              <div style={{color:c, fontWeight:'700', fontSize:'20px'}}>{$m(v)}</div>
            </div>
          ))}
        </div>
        <div style={{height:'6px', background:'#1A1A28', borderRadius:'3px', overflow:'hidden', margin:'14px 0 5px'}}>
          <div style={{height:'100%', borderRadius:'3px', background:'linear-gradient(90deg,#56C27A,#5BA4E5)', width:`${assets>0?Math.min(100,Math.max(0,(nw/assets)*100)):0}%`, transition:'width 0.4s'}}/>
        </div>
        <div style={{fontSize:'11px', color:'#445566'}}>{assets>0?`${Math.round((nw/assets)*100)}% of assets are equity`:''}</div>
      </div>

      <div style={S.card}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px'}}>
          <span style={{fontWeight:'700', color:'#56C27A'}}>Assets</span>
          {!editing && <button style={S.btnSm} onClick={()=>setEditing(true)}>✏ Update</button>}
        </div>
        {[['Checking','checkingBalance'],['Savings / HYSA','savingsBalance'],['Investments (401k/IRA/brokerage)','investmentBalance'],['Home value','homeValue'],['Other assets','otherAssets']].map(([l,k])=>(
          <div key={k} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 0', borderBottom:'1px solid #12121E'}}>
            <span style={{color:'#8899AA', fontSize:'13px'}}>{l}</span>
            {editing
              ? <input style={{...S.numInput, width:'115px', textAlign:'right'}} type="number" value={local[k]??0} onChange={e=>upd(k,e.target.value)}/>
              : <span style={{color:'#E8EAF0', fontWeight:'500'}}>{$m(setup[k]??0)}</span>
            }
          </div>
        ))}
        <div style={{display:'flex', justifyContent:'space-between', padding:'10px 0'}}>
          <strong style={{color:'#56C27A'}}>Total</strong>
          <strong style={{color:'#56C27A', fontSize:'15px'}}>{$m(assets)}</strong>
        </div>
      </div>

      <div style={S.card}>
        <div style={{fontWeight:'700', color:'#FF6B6B', marginBottom:'12px'}}>Debts</div>
        {[['Mortgage','mortgageBalance'],['Other debt','otherDebtBalance']].map(([l,k])=>(
          <div key={k} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 0', borderBottom:'1px solid #12121E'}}>
            <span style={{color:'#8899AA', fontSize:'13px'}}>{l}</span>
            {editing
              ? <input style={{...S.numInput, width:'115px', textAlign:'right'}} type="number" value={local[k]??0} onChange={e=>upd(k,e.target.value)}/>
              : <span style={{color:'#E8EAF0', fontWeight:'500'}}>{$m(setup[k]??0)}</span>
            }
          </div>
        ))}
        <div style={{display:'flex', justifyContent:'space-between', padding:'10px 0'}}>
          <strong style={{color:'#FF6B6B'}}>Total</strong>
          <strong style={{color:'#FF6B6B', fontSize:'15px'}}>{$m(debt)}</strong>
        </div>
      </div>

      {editing && (
        <div style={{display:'flex', gap:'10px', marginBottom:'10px'}}>
          <button style={{...S.btn1, flex:1}} onClick={()=>{setSetup({...setup,...local});setEditing(false);}}>Save</button>
          <button style={{...S.btn2, flex:1}} onClick={()=>{setLocal({...setup});setEditing(false);}}>Cancel</button>
        </div>
      )}

      {(setup.homeValue||0) > 0 && (
        <div style={{...S.card, background:'#0A180A', borderColor:'#1E3A20'}}>
          <div style={{fontSize:'12px', color:'#8899AA'}}>
            🏠 Home equity: <strong style={{color:'#56C27A'}}>{$m((setup.homeValue||0)-(setup.mortgageBalance||0))}</strong>
            <span style={{color:'#445566'}}> · {Math.round(100-((setup.mortgageBalance||0)/(setup.homeValue||1)*100))}% owned</span>
          </div>
        </div>
      )}

      <div style={{...S.card, borderColor:'#1E3050', background:'#0A0F1A', marginTop:'4px'}}>
        <div style={{fontSize:'12px', color:'#8899AA', lineHeight:'1.8'}}>
          📱 <strong style={{color:'#5BA4E5'}}>Add to iPhone home screen:</strong> Open in Safari → Share (⬆) → "Add to Home Screen"
        </div>
      </div>
      <div style={{height:12}}/>
    </div>
  );
}

// ─── FIRE TAB ─────────────────────────────────────────────────────────────────
function FireTab({ setup, setSetup, totalBudget }) {
  const [local, setLocal] = useState({
    currentAge:        setup.currentAge ?? 45,
    fireAge:           setup.fireAge ?? 55,
    fireAnnualSpend:   setup.fireAnnualSpend ?? (totalBudget*12*0.8),
    annualSavings:     setup.annualSavings ?? 150000,
    investmentBalance: setup.investmentBalance ?? 0,
    takeHomePay:       setup.takeHomePay ?? 0,
  });
  const set = (k,v) => setLocal(p=>({...p,[k]:parseFloat(v)||0}));

  const fireNum = local.fireAnnualSpend/0.04;
  const inv     = local.investmentBalance;
  const firePct = fireNum>0?Math.min(1,inv/fireNum):0;
  const yrs     = yearsToFIRE(inv, local.annualSavings, fireNum);
  const projAge = local.currentAge+yrs;
  const onTrack = projAge<=local.fireAge;
  const srPct   = local.takeHomePay>0?Math.round(local.annualSavings/local.takeHomePay/12*100):0;

  return (
    <div style={S.page}>
      <div style={{...S.hero, textAlign:'center'}}>
        <div style={S.heroLbl}>FIRE Number</div>
        <div style={{...S.heroAmt, color:'#F4B942'}}>{$m(fireNum)}</div>
        <div style={S.heroSub}>{$m(local.fireAnnualSpend)}/yr × 25 <span style={{color:'#445566'}}>(4% rule)</span></div>
        <div style={{height:'8px', background:'#1A1A28', borderRadius:'4px', overflow:'hidden', margin:'12px 0 6px'}}>
          <div style={{height:'100%', borderRadius:'4px', background:'linear-gradient(90deg,#F4B942,#F97316)', width:`${firePct*100}%`, transition:'width 0.4s'}}/>
        </div>
        <div style={{display:'flex', justifyContent:'space-between', fontSize:'12px'}}>
          <span style={{color:'#F4B942', fontWeight:'700'}}>{$m(inv)} saved ({Math.round(firePct*100)}%)</span>
          <span style={{color:'#8899AA'}}>{$m(Math.max(0,fireNum-inv))} to go</span>
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'8px', marginBottom:'12px'}}>
        {[['Years Away',yrs<=80?yrs:'80+','#5BA4E5'],['FIRE Age',projAge<=120?projAge:'80+',onTrack?'#56C27A':'#F4B942'],['Savings Rate',`${srPct}%`,srPct>=40?'#56C27A':'#F4B942']].map(([l,v,c])=>(
          <div key={l} style={{background:'#0F0F1E', border:'1px solid #1A1A28', borderRadius:'12px', padding:'12px 8px', textAlign:'center'}}>
            <div style={{fontSize:'10px', color:'#445566', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:'5px'}}>{l}</div>
            <div style={{fontSize:'22px', fontWeight:'700', color:c}}>{v}</div>
          </div>
        ))}
      </div>

      {yrs===0 && <div style={{...S.card, background:'#0A180A', borderColor:'#1E3A20', marginBottom:'12px'}}>
        <div style={{fontWeight:'700', color:'#56C27A', fontSize:'16px', marginBottom:'4px'}}>🎉 You've reached FIRE!</div>
        <div style={{fontSize:'12px', color:'#8899AA'}}>Your portfolio can sustain your lifestyle at a 4% withdrawal rate.</div>
      </div>}
      {yrs>0 && onTrack && <div style={{...S.card, background:'#0A180A', borderColor:'#1E3A20', marginBottom:'12px'}}>
        <div style={{fontWeight:'700', color:'#56C27A', marginBottom:'4px'}}>✓ On track!</div>
        <div style={{fontSize:'12px', color:'#8899AA'}}>You'll hit your number {local.fireAge-projAge>0?`${local.fireAge-projAge} years ahead of schedule`:'right at your target age'}.</div>
      </div>}
      {yrs>0 && !onTrack && <div style={{...S.card, background:'#180F0A', borderColor:'#3A2010', marginBottom:'12px'}}>
        <div style={{fontWeight:'700', color:'#F4B942', marginBottom:'4px'}}>⚠ Projecting FIRE at {projAge}, target was {local.fireAge}</div>
        <div style={{fontSize:'12px', color:'#8899AA'}}>
          {projAge-local.fireAge} years late. Increasing annual savings by {$m(Math.round(local.annualSavings*0.1/500)*500)} could close the gap by ~1 year.
        </div>
      </div>}

      <div style={S.card}>
        <div style={{fontSize:'14px', fontWeight:'700', marginBottom:'14px'}}>Your Numbers</div>
        <F l="Current investments (401k + IRA + brokerage)" t="number" p="$" v={local.investmentBalance} c={v=>set('investmentBalance',v)}/>
        <F l="Amount you invest per year" t="number" p="$" v={local.annualSavings} c={v=>set('annualSavings',v)} h="Across all accounts combined"/>
        <F l="Desired annual spending in retirement" t="number" p="$" v={local.fireAnnualSpend} c={v=>set('fireAnnualSpend',v)} h="Usually 70–80% of today's spending"/>
        <R2>
          <F l="Current age" t="number" v={local.currentAge} c={v=>set('currentAge',v)}/>
          <F l="FIRE target age" t="number" v={local.fireAge} c={v=>set('fireAge',v)}/>
        </R2>
        <F l="Monthly take-home pay" t="number" p="$" v={local.takeHomePay} c={v=>set('takeHomePay',v)} h="After taxes — for savings rate"/>
        <button style={{...S.btn1, marginTop:'4px'}} onClick={()=>setSetup({...setup,...local})}>Save</button>
      </div>

      <div style={S.card}>
        <div style={{fontSize:'14px', fontWeight:'700', marginBottom:'4px'}}>Withdrawal Rate Scenarios</div>
        <div style={{fontSize:'11px', color:'#445566', marginBottom:'12px'}}>Lower rate = more conservative = bigger safety cushion</div>
        {[[3.0,'Conservative','#5BA4E5'],[3.5,'Moderate','#56C27A'],[4.0,'Standard','#F4B942'],[5.0,'Aggressive','#F97316']].map(([wr,desc,c])=>{
          const fn=local.fireAnnualSpend/(wr/100), p=fn>0?Math.min(1,inv/fn):0, y=yearsToFIRE(inv,local.annualSavings,fn);
          return (
            <div key={wr} style={{padding:'10px 0', borderBottom:'1px solid #12121E'}}>
              <div style={{display:'flex', justifyContent:'space-between', marginBottom:'5px'}}>
                <div><span style={{color:c, fontWeight:'700'}}>{wr}% </span><span style={{color:'#445566', fontSize:'11px'}}>{desc}</span></div>
                <div style={{textAlign:'right'}}>
                  <span style={{color:'#F4F4F4', fontWeight:'600'}}>{$m(fn)}</span>
                  <span style={{color:'#445566', fontSize:'11px', marginLeft:'8px'}}>{Math.round(p*100)}% · {y} yrs</span>
                </div>
              </div>
              <div style={{height:'3px', background:'#1A1A28', borderRadius:'2px', overflow:'hidden'}}>
                <div style={{height:'100%', borderRadius:'2px', background:c, width:`${p*100}%`}}/>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{height:12}}/>
    </div>
  );
}

// ─── SHARED COMPONENTS ────────────────────────────────────────────────────────
function MonthPicker({ months, sm, sy, onChange }) {
  const [open, setOpen] = useState(false);
  const now = new Date();
  return (
    <div style={{position:'relative'}}>
      <button style={S.monthBtn} onClick={()=>setOpen(!open)}>{MONTHS[sm]} {sy} ▾</button>
      {open && (
        <div style={S.drop}>
          <button style={S.dropOpt} onClick={()=>{onChange(now.getMonth(),now.getFullYear());setOpen(false);}}>This Month</button>
          {months.slice(0,10).map(m=>(
            <button key={m.label}
              style={{...S.dropOpt, color:m.month===sm&&m.year===sy?'#5BA4E5':'#E8EAF0', background:m.month===sm&&m.year===sy?'#1A2A3E':'transparent'}}
              onClick={()=>{onChange(m.month,m.year);setOpen(false);}}>
              {m.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function F({l,v,c,t='text',p,h}) {
  return (
    <div style={{marginBottom:'13px'}}>
      <div style={{fontSize:'12px', color:'#8899AA', marginBottom:'5px'}}>{l}</div>
      <div style={{display:'flex', alignItems:'center', gap:'5px'}}>
        {p && <span style={{color:'#445566', fontSize:'15px'}}>{p}</span>}
        <input style={{...S.fieldInput, flex:1}} type={t} inputMode={t==='number'?'decimal':undefined}
          value={v??''} onChange={e=>c(e.target.value)}/>
      </div>
      {h && <div style={{fontSize:'11px', color:'#333', marginTop:'3px'}}>{h}</div>}
    </div>
  );
}
function R2({children}) { return <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px'}}>{children}</div>; }
function SH({children}) { return <div style={{fontSize:'11px', fontWeight:'700', color:'#445566', textTransform:'uppercase', letterSpacing:'0.08em', margin:'16px 0 8px'}}>{children}</div>; }
